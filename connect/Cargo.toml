[package]
name = "connect-ps5"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
usb-autostart = []
shell-pcm = ["usb-autostart"]
kabuki-provider = ["shell-pcm"]

[dependencies]
# Spotify Connect receiver. No audio backend of its own (the app plays the samples), TLS in
# pure Rust with bundled root certificates, and a pure-Rust mDNS responder for discovery.
librespot = { version = "0.8.0", default-features = false, features = ["rustls-tls-webpki-roots", "with-libmdns"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util", "macros"] }
# The overlay panel's channel (control.rs); already in the tree through librespot.
serde_json = "1"
futures-util = "0.3"
# For fetching cover pictures through librespot's own HTTP client.
http = "1"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client"] }
image = { version = "=0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4"
sha1 = "0.10"
hex = "0.4"
protobuf = "3"

[workspace]

# librespot-core with one change: audio key requests are retried (see
# vendor/librespot-core/src/audio_key.rs) and the saved login is encrypted (cache.rs).
[patch.crates-io]
librespot-core = { path = "../vendor/librespot-core" }
# librespot-connect with one addition: it reports the queue (on_next_tracks, for the console
# overlay's Queue tab; see vendor/librespot-connect/src/lib.rs).
librespot-connect = { path = "../vendor/librespot-connect" }

[profile.release]
panic = "abort"
opt-level = 2
